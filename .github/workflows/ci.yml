name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clearclause
          POSTGRES_PASSWORD: clearclause
          POSTGRES_DB: clearclause
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clearclause" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://clearclause:clearclause@localhost:5432/clearclause
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
      UPLOAD_DIR: /tmp/uploads
      REPORT_DIR: /tmp/reports
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System deps (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install ruff==0.8.4
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t clearclause-backend ./backend
      - name: Build frontend image
        run: docker build -t clearclause-frontend ./frontend
      - name: Trivy scan (backend, non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: clearclause-backend
          severity: HIGH,CRITICAL
          exit-code: "0"
