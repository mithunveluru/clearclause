# Alerts for the ways ClearClause degrades quietly rather than failing loudly.
# A down service is obvious. These are not: the app keeps returning 200s while
# doing the wrong thing, which is the failure mode that actually reaches users.

groups:
  - name: clearclause-degradation
    rules:
      - alert: RateLimiterUnavailable
        # Redis is gone, so the limiter fails open and every login, upload and Q&A is
        # allowed through unthrottled. The app looks healthy. Brute-force protection
        # and account lockout are both off until Redis comes back.
        expr: increase(clearclause_degraded_events_total{kind="rate_limiter_unavailable"}[5m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Rate limiting is OFF — Redis unreachable"
          description: >-
            Requests are being allowed without any rate limit, and account lockout is
            not counting failures. The API is still serving 200s. Restore Redis.

      - alert: LowOcrConfidenceSpike
        # A garbled scan produces few clauses, and few clauses render as "no risks
        # found" — the app confidently tells someone their contract is clean because
        # it could not read it. Users see a warning banner, but a spike means
        # something upstream (a bad uploader, a broken renderer) is systematically
        # feeding us documents we cannot read.
        expr: increase(clearclause_degraded_events_total{kind="low_ocr_confidence"}[30m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Documents are arriving too poor to read"
          description: >-
            More than 5 documents in 30 minutes scored below OCR_LOW_CONFIDENCE.
            Their analysis is unreliable and may under-report risk.

      - alert: PipelineFailures
        expr: increase(clearclause_analyzer_runs_total{status="failed"}[15m]) > 3
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Document analysis is failing"
          description: "More than 3 analyzer runs failed in 15 minutes."

      - alert: ApiDown
        expr: up{job="clearclause-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "ClearClause API is not being scraped"
